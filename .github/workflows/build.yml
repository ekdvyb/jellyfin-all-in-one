name: 🏗️ Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.AllInOne/Jellyfin.Plugin.AllInOne.csproj
      - name: Build
        run: dotnet build Jellyfin.Plugin.AllInOne/Jellyfin.Plugin.AllInOne.csproj -c Release --no-restore
      - name: Upload Jellyfin 10.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.AllInOne-net9.0
          path: Jellyfin.Plugin.AllInOne/bin/Release/net9.0/Jellyfin.Plugin.AllInOne.dll
      - name: Upload Jellyfin 12.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.AllInOne-net10.0
          path: Jellyfin.Plugin.AllInOne/bin/Release/net10.0/Jellyfin.Plugin.AllInOne.dll
