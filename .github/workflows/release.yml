name: 📦 Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 1.1.0.0'
        required: true
        default: '1.1.0.0'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build Jellyfin 10.11 package
        run: |
          dotnet build Jellyfin.Plugin.AllInOne/Jellyfin.Plugin.AllInOne.csproj \
            -c Release -f net9.0 \
            -p:Version=${{ inputs.version }} \
            -p:AssemblyVersion=${{ inputs.version }} \
            -p:FileVersion=${{ inputs.version }}
          mkdir -p dist
          cp Jellyfin.Plugin.AllInOne/bin/Release/net9.0/Jellyfin.Plugin.AllInOne.dll dist/
          (cd dist && zip -j "../jellyfin-plugin-all-in-one-${{ inputs.version }}-jellyfin10.11.zip" Jellyfin.Plugin.AllInOne.dll)
          rm dist/Jellyfin.Plugin.AllInOne.dll

      - name: Build Jellyfin 12 package
        run: |
          dotnet build Jellyfin.Plugin.AllInOne/Jellyfin.Plugin.AllInOne.csproj \
            -c Release -f net10.0 \
            -p:Version=${{ inputs.version }} \
            -p:AssemblyVersion=${{ inputs.version }} \
            -p:FileVersion=${{ inputs.version }}
          cp Jellyfin.Plugin.AllInOne/bin/Release/net10.0/Jellyfin.Plugin.AllInOne.dll dist/
          (cd dist && zip -j "../jellyfin-plugin-all-in-one-${{ inputs.version }}-jellyfin12.zip" Jellyfin.Plugin.AllInOne.dll)

      - name: Show checksums
        run: md5sum jellyfin-plugin-all-in-one-*.zip

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-all-in-one-${{ inputs.version }}
          path: jellyfin-plugin-all-in-one-*.zip
